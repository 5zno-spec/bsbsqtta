<body>
<div id="splash" class="splash" role="status" aria-label="جارٍ التحميل">
  <img class="splash-logo" src="icons/logo.png" alt="نمور النشيط" draggable="false">
  <div class="splash-bar"><b></b></div>
</div>
<main class="app">
  <section class="stage" id="stage" data-mode="eat">
    <div class="play">
    <div id="decor" class="decor"></div>
    <div id="actor" class="actor"><div id="think" class="think" role="status" aria-live="polite" hidden></div><div id="tiger" class="tiger"><img class="part p-tail" src="parts/tail.png" alt="" draggable="false"><img class="part p-arm" src="parts/arm.png" alt="" draggable="false"><img class="part p-legL" src="parts/legL.png" alt="" draggable="false"><img class="part p-legR" src="parts/legR.png" alt="" draggable="false"><img class="base" src="parts/base.png" alt="النمر" draggable="false"><svg class="mouth" viewBox="0 0 1024 1024" aria-hidden="true"><defs><clipPath id="mc"><path d="M338 306 Q465 402 592 298 Q585 448 465 450 Q345 448 338 306 Z"/></clipPath></defs><path class="m" d="M338 306 Q465 402 592 298 Q585 448 465 450 Q345 448 338 306 Z"/><ellipse class="tongue" cx="465" cy="434" rx="62" ry="30" clip-path="url(#mc)"/></svg><svg class="eyes" viewBox="0 0 1024 1024" aria-hidden="true"><defs><clipPath id="ecL"><path d="M374 128 C385 118 405 108 417 109 C428 110 439 122 444 134 C449 146 449 168 447 182 C446 197 443 213 435 222 C427 230 412 235 399 233 C387 231 368 220 360 210 C352 199 349 184 351 170 C354 157 363 138 374 128Z"/></clipPath><clipPath id="ecR"><path d="M506 180 C512 162 534 139 548 129 C562 118 577 116 589 119 C602 122 613 138 621 148 C630 158 643 165 639 180 C636 195 618 225 602 236 C586 248 557 248 542 248 C527 248 519 248 513 236 C507 225 500 198 506 180Z"/></clipPath></defs><g clip-path="url(#ecL)"><g class="lid" style="--dy:-150px"><path class="lf" d="M335 40H475V208H440Q400 238 362 200H335Z"/><path class="ll" d="M362 200Q400 238 440 208"/></g></g><g clip-path="url(#ecR)"><g class="lid" style="--dy:-155px"><path class="lf" d="M500 50H645V218H610Q560 252 522 224H500Z"/><path class="ll" d="M522 224Q560 252 610 218"/></g></g></svg></div><div class="shadow"></div></div>
    <div id="plots" class="layer"></div>
    <div id="bubbles" class="layer"></div>
    <div id="layer" class="layer"></div>
    <div id="fx" class="layer fx"></div>
  </div>
  </section>

  <header class="hud">
    <h1>نمور النشيط</h1>
    <section class="stats" aria-label="حالة النمر">
    <div class="stat"><span>🍖 الجوع</span><i><b id="b-hunger"></b></i></div>
    <div class="stat"><span>🛁 النظافة</span><i><b id="b-hygiene"></b></i></div>
    <div class="stat"><span>⚡ الطاقة</span><i><b id="b-energy"></b></i></div>
    <div class="stat"><span>🏠 البيت</span><i><b id="b-room"></b></i></div>
  </section>
  </header>

  <button id="snd" class="snd" type="button" aria-label="الصوت" aria-pressed="true">🔊</button>

  <div class="dock">
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <section id="panel" class="panel"></section>
    <nav class="nav" aria-label="الأنشطة">
    <button data-mode="farm">🌱<span>مزرعة</span></button>
    <button data-mode="eat"><img class="ico" src="apple/apple.png" alt="" draggable="false"><span>أكل</span></button>
    <button data-mode="bath">🛁<span>استحمام</span></button>
    <button data-mode="clean">🧹<span>تنظيف</span></button>
    <button data-mode="sleep">🌙<span>نوم</span></button>
  </nav>
  </div>
</main>
<div id="install" class="install" hidden>
  <div class="glass" role="dialog" aria-label="تثبيت نمور النشيط">
    <img src="icons/logo.png" alt="نمور النشيط" draggable="false">
    <button id="install-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
      <span>تثبيت</span>
    </button>
  </div>
</div>
<script src="sound.js"></script>
<script src="game.js"></script>
<script src="install.js"></script>
